<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b18"><title>Ravena • Pescaria RPG</title><link rel="stylesheet" href="css/game.css"></head>
<body><main id="gameWrap"><canvas id="game" aria-label="Ravena Pescaria RPG"></canvas>
<header class="hud"><div class="brand"><b>🌙 RAVENA</b><small>PESCARIA RPG • V3</small></div><div class="stats"><span>🪙 <b id="coins">1635</b></span><span>🪱 <b id="bait">7</b></span><span>🎒 <b id="bag">0.0</b>/100kg</span></div></header>
<div id="quest" class="quest"><b>🌹 Noite em Azarath</b><span>Pesque em qualquer margem e visite a vila.</span></div>
<div id="hint" class="hint hidden">🎣 <b>Píer</b><span>Pressione E para pescar</span></div>
<div id="toast" class="toast"></div>
<div class="mobile-controls"><div id="joy" class="joystick"><div class="joy-ring"></div><div id="stick" class="stick"></div></div><button id="action" class="action">E<small>INTERAGIR</small></button></div>
<div class="minimap"><canvas id="mini" width="150" height="150"></canvas><b>N</b></div><button id="bagBtn" class="bag-btn">🎒</button>
<div id="panel" class="panel"><div class="panel-card"><button id="closePanel" class="close">×</button><div id="panelBody"></div></div></div>
<div id="roseTransition" class="rose-transition"><div class="rose">🌹</div><b>RAVENA</b><span id="roseText">Entrando...</span></div>
</main><script src="js/game.js"></script></body></html>
